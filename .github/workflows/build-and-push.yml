name: Build and push images

# Builds docker/corefront/Dockerfile and docker/admin/Dockerfile and pushes
# both to GHCR. This is the intended way production images get built —
# docker-stack.yml (see docs/DEPLOYMENT.md) only ever pulls a tag from GHCR,
# it never builds. A fresh GitHub-hosted runner has no persistent BuildKit
# cache by default, so the CACHEBUST gotcha documented in both Dockerfiles
# doesn't bite here the way it can on a long-lived local Docker install —
# github.sha is passed anyway, both because it's the technically-correct
# cache key and in case cache persistence (actions/cache, a registry cache)
# gets added later.
#
# The Dockerfiles clone this same repo from inside the build (see their own
# comments for why); the actual local checkout below exists only to give
# `docker/build-push-action` the Dockerfile and docker/entrypoint-secrets.sh
# themselves, which are read from the local build context, not the clone.

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: corefront
            dockerfile: docker/corefront/Dockerfile
          - image: admin
            dockerfile: docker/admin/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/optisoftprime/petra-${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_REF=${{ github.ref_name }}
            CACHEBUST=${{ github.sha }}
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
